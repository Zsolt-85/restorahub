name: restorahub
description: RestoraHub booking application
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.6
  intl: ^0.20.2

  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  share_plus: ^10.1.0

  provider: ^6.1.5+1

  shared_preferences: ^2.2.2
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0

  add_2_calendar: ^3.0.1
  url_launcher: ^6.3.1
  table_calendar: ^3.1.4
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
